<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ Tỷ Phú Việt Nam 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#e4ece2;--fg:#1c2a21;--cell:#fbfaf4;--line:#8fa493;--lac:#9b1c2e;--gold:#f2c14e;--mut:#5a6a5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1912;--fg:#e6efe4;--cell:#1a2a20;--line:#36493c;--lac:#7d1727;--mut:#9fb2a4}}
:root[data-theme="dark"]{--bg:#0e1912;--fg:#e6efe4;--cell:#1a2a20;--line:#36493c;--lac:#7d1727;--mut:#9fb2a4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:hidden}
.w{max-width:720px;margin:0 auto;padding:10px}
#stg{position:relative;perspective:1600px;--rx:40deg;--rz:0deg;--sc:.95}
#stg.sk{animation:sk .45s}
@keyframes sk{20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
#bd{position:absolute;left:0;width:100%;top:50%;margin-top:-50%;aspect-ratio:1;display:grid;grid-template:repeat(11,minmax(0,1fr))/repeat(11,minmax(0,1fr));gap:1px;background:var(--line);border:2px solid var(--line);border-radius:6px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateZ(var(--rz)) scale(var(--sc));transition:transform .6s}
#bd::before,#bd::after{content:"";position:absolute;inset:-2px;border-radius:8px;background:#6b1424;transform:translateZ(-9px)}
#bd::after{background:#3a0a14;transform:translateZ(-18px);box-shadow:0 30px 40px #0008}
.c{background:var(--cell);position:relative;display:flex;flex-direction:column;transform-style:preserve-3d;font-size:clamp(5px,1.55vw,10.5px);line-height:1.1;text-align:center}
.c.own{box-shadow:inset 0 0 0 2px var(--oc),inset 0 0 0 3px var(--cell)}
.c.cu{outline:2px solid var(--gold);outline-offset:-2px;z-index:2}
.bn{height:20%;flex:none}
.n{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;font-weight:600;overflow:hidden}
.n i{font-style:normal;font-weight:400;color:var(--mut)}
.k .n{font-weight:800}
.sb{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;white-space:nowrap;line-height:1;pointer-events:none;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz)*-1)) rotateX(calc(var(--rx)*-1));transition:transform .6s}
.tk{font-size:2em}.tk b{font-weight:400;filter:drop-shadow(0 2px 2px #0006)}
.hs{bottom:55%;font-size:1.9em}
.sw{position:absolute;left:22%;right:22%;bottom:8%;height:12%;background:#0005;border-radius:50%}
.hp{display:inline-block;animation:hop .23s}
@keyframes hop{50%{transform:translateY(-.6em)}}
#mid{grid-area:2/2/11/11;background:var(--lac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;outline:2px solid var(--gold);outline-offset:-5px;transform-style:preserve-3d;position:relative}
#mid h1{margin:0;margin-top:14%;font-size:clamp(11px,4.2vw,28px);font-weight:800;line-height:1;color:var(--gold)}
#mid h1 small{display:block;font-size:.55em;font-weight:600;color:#fff;letter-spacing:.3em;margin-top:4px}
.dg{bottom:48%;font-size:clamp(30px,11vw,72px)}
.tb{position:absolute;right:0;top:0;z-index:7;display:flex;gap:4px}
.mi{width:34px;height:34px;border:0;border-radius:8px;background:var(--cell);color:var(--fg);font-size:16px;cursor:pointer;box-shadow:0 1px 4px #0004}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.pp{position:absolute;left:50%;top:35%;white-space:nowrap;font-weight:800;font-size:clamp(20px,6.5vw,44px);color:var(--c);text-shadow:0 2px 0 #000,0 0 14px var(--c);animation:pp 1.8s forwards}
@keyframes pp{0%{opacity:0;transform:translate(-50%,24px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.2)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-56px)}}
.fl{position:absolute;inset:0;background:var(--c);animation:fl .7s forwards}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.cd{position:absolute;left:50%;top:50%;width:62%;padding:16px 12px;border-radius:14px;background:var(--gold);color:#2a1a00;text-align:center;font-size:clamp(11px,3vw,17px);box-shadow:0 10px 30px #000a;border:3px solid #fff8;animation:cd 1.85s forwards}
.cd b{font-size:1.3em;color:var(--lac)}
@keyframes cd{0%{opacity:0;transform:translate(-50%,-50%) perspective(600px) rotateY(90deg) scale(.6)}16%{opacity:1;transform:translate(-50%,-50%) perspective(600px) rotateY(0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) perspective(600px) scale(1.1)}}
.cf{position:absolute;top:-10%;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
#hud{margin-top:10px;background:var(--lac);color:#fff;border-radius:10px;padding:12px;outline:2px solid var(--gold);outline-offset:-5px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ds{display:flex;gap:10px}
.dw{perspective:400px;width:46px;height:46px;margin:6px}
.dc,.di{position:relative;width:46px;height:46px;transform-style:preserve-3d}
.dc.roll{animation:spin .9s cubic-bezier(.2,.7,.3,1)}
@keyframes spin{from{transform:translateY(-26px) rotateX(1080deg) rotateY(900deg)}to{transform:translateY(0) rotateX(0) rotateY(0)}}
.di{transition:none}
.di i{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#9b1c2e;font-style:normal;font-size:40px;line-height:1;border-radius:8px;backface-visibility:hidden}
.di i:nth-child(1){transform:translateZ(23px)}
.di i:nth-child(2){transform:rotateY(180deg) translateZ(23px)}
.di i:nth-child(3){transform:rotateY(90deg) translateZ(23px)}
.di i:nth-child(4){transform:rotateY(-90deg) translateZ(23px)}
.di i:nth-child(5){transform:rotateX(90deg) translateZ(23px)}
.di i:nth-child(6){transform:rotateX(-90deg) translateZ(23px)}
.hm{flex:1;min-width:150px}
.trn{font-weight:800;color:var(--gold);font-size:16px}
.msg{font-size:13px;line-height:1.35}
.bt{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;padding:.55em 1.1em;background:var(--gold);color:#2a1a00;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.mi:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px #fffa}
#pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:10px 0}
.pc{background:var(--cell);border-left:5px solid var(--oc);border-radius:4px;padding:6px 8px;font-size:13px}
.pc small{color:var(--mut);margin-left:6px}
.pc.on{outline:2px solid var(--gold)}
.pc.x{opacity:.4;text-decoration:line-through}
#lg{font-size:12px;color:var(--mut)}
#lg div:first-child{color:var(--fg);font-weight:600}
.su{max-width:420px;margin:6vh auto}
.su h1{font-size:34px;line-height:1.05;margin:0 0 10px;font-weight:800;color:var(--lac)}
.su h1 span{display:block;font-size:16px;letter-spacing:.3em;color:var(--fg);margin-top:6px}
.su p{color:var(--mut);margin:0 0 18px}
.su label{display:block;margin:0 0 12px;font-weight:600}
.su select{display:block;width:100%;margin-top:4px;font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--cell);color:var(--fg)}
#mg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));background:#000d;color:#fff;overflow:auto;animation:fi .4s}
@keyframes fi{from{opacity:0}}
.mgb{width:100%;max-width:560px;text-align:center;border-radius:14px;padding:18px 14px;background:#1a1a1f;outline:2px solid var(--gold);outline-offset:-5px}
.mgb h2{margin:0 0 4px;color:var(--gold);font-size:clamp(18px,5vw,26px);font-weight:800}
.mgb p{margin:0 0 12px;font-size:13px;color:#ddd}
#mgs{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#mgc{margin-top:12px;display:flex;gap:8px;justify-content:center}
.ly .mgb{background:radial-gradient(circle at 50% 0,#4a0f18,#0b0305 70%)}
.duck .mgb{background:#0b3b5c}
.five .mgb{background:radial-gradient(#2c2f36,#0d0e11)}
.gc .mgb{background:linear-gradient(160deg,#2a0f4d,#0c0620)}
.rl{font-size:clamp(18px,5vw,28px);font-weight:800;padding:14px 18px;border-radius:10px;background:#0006}
.rl.on{color:#2a1a00;background:var(--gold);animation:pp2 .5s}
@keyframes pp2{50%{transform:scale(1.15)}}
.cups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cup{width:78px;height:100px;border-radius:8px 8px 30px 30px;background:linear-gradient(#ffffff22,#ffffff08);border:2px solid #ffffff44;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cup span{font-size:38px;line-height:1}.cup small{color:#bbb}
.cup.ok{opacity:.55;cursor:default}
.cup.sel{animation:wob .25s infinite;border-color:var(--gold)}
.cup.bad{background:#a3121f;border-color:#ff5a5a;animation:sk .5s}
@keyframes wob{50%{transform:rotate(6deg) translateY(-6px)}}
.pool{font-weight:700;color:var(--gold)}
.lane{position:relative;width:100%;height:42px;border-radius:6px;background:linear-gradient(#1b7fb5,#126493);overflow:hidden;border-bottom:2px solid #0a3d5e}
.lane:after{content:"🏁";position:absolute;right:4px;top:6px;font-size:22px}
.dk{position:absolute;left:0;top:3px;font-size:30px;line-height:1.1;white-space:nowrap;transition:left .11s linear}
.dk small{font-size:11px;font-weight:700;margin-left:3px;text-shadow:0 1px 2px #000}
.dial{width:190px;height:190px;border-radius:50%;background:radial-gradient(#15161a,#000);border:6px solid #888;box-shadow:0 0 30px #000,inset 0 0 20px #000;display:grid;place-items:center;font-size:34px;font-weight:800}
.dial.run{animation:hb 1s infinite;border-color:var(--gold)}
@keyframes hb{50%{box-shadow:0 0 40px #f2c14e88,inset 0 0 20px #000}}
.reel b{display:grid;place-items:center;min-width:130px;height:100px;padding:0 18px;font-size:60px;background:#fff;color:#2a0f4d;border-radius:10px;box-shadow:inset 0 -8px 12px #0003}
.rs{width:100%;display:grid;gap:6px}
.rs div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;background:#ffffff14;padding:8px 10px;border-radius:6px;text-align:left}
.rs i{flex-basis:100%;font-style:normal;font-size:12px;color:#ccc}
.tn .mgb{background:radial-gradient(circle at 50% 0,#3a3f4a,#0a0b0e 75%)}
.bus .mgb{background:radial-gradient(#0d5c3a,#06301f)}
.duo{display:flex;gap:16px}
.cd2{width:120px;height:150px;border-radius:10px;background:#ffffff14;border:2px solid #fff4;display:grid;place-items:center;font-size:54px;line-height:1}
.cd2 small{display:block;font-size:12px;margin-top:6px}
.cd2.flip{animation:fp .6s;border-color:var(--gold)}
@keyframes fp{from{transform:perspective(500px) rotateY(90deg)}}
.felt{display:flex;gap:8px;justify-content:center}
.felt.tb2{flex-direction:column;width:100%}
.pk{width:52px;height:76px;border-radius:6px;display:inline-grid;place-items:center;background:#7d1727;color:#f2c14e;font-size:26px;border:2px solid #fff8;margin:2px}
.pk.up{background:#fff;color:#111;font-weight:800;font-size:20px}
.pk.up.red{color:#c8102e}
.pk.bad{outline:3px solid #ff5a5a;animation:sk .5s}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:13px}
.rowh .pk{width:38px;height:54px;font-size:16px}
.mn .mgb{background:linear-gradient(160deg,#4a2000,#120700)}
.bi .mgb{background:linear-gradient(#0d3b22,#06170e)}
.rowh2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rowh2 span{background:#ffffff14;padding:4px 8px;border-radius:6px;font-size:13px}
.rowh2 .on{outline:2px solid var(--gold)}
#cv{width:100%;max-width:420px;border-radius:8px;touch-action:none;box-shadow:0 6px 20px #000a}
.pad{display:flex;justify-content:space-between;gap:12px;width:100%;max-width:420px}
.pad span{display:flex;gap:8px;align-items:center}
.pad button{width:64px;height:48px;font-size:22px;border:0;border-radius:8px;background:#ffffff22;color:#fff;touch-action:none}
.cp .mgb{background:linear-gradient(160deg,#2a1d45,#0c0a14)}
.alt{background:var(--cell);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.ek{display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;width:60px;height:86px;margin:2px;padding:6px 2px;border-radius:8px;background:linear-gradient(160deg,var(--c,#444),#000b);border:2px solid #fff9;color:#fff;font-style:normal;font-size:10px;font-weight:700;line-height:1.1;text-align:center;box-shadow:0 3px 8px #0008;vertical-align:top}
.ek em{font-style:normal;font-size:28px;line-height:1.2}
.ek.sm{width:48px;height:68px;font-size:8.5px;padding:4px 1px}.ek.sm em{font-size:20px}
.ek.dd{opacity:.45;filter:grayscale(.8)}
.ek.bk{--c:#ff7a00;background:repeating-linear-gradient(45deg,#b34700 0 7px,#ff7a00 7px 14px);justify-content:center}
.ek.ph{background:none;border:2px dashed #fff5;box-shadow:none}
.piles{display:flex;gap:18px;justify-content:center;align-items:center}
.hand{display:flex;flex-wrap:wrap;justify-content:center;max-width:100%}
.rowh2 .x{opacity:.4}
.pk.up{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:center;padding:3px 0}
.pk b{font-size:.62em;align-self:flex-start;margin-left:4px;line-height:1}
.pk em{font-style:normal;font-size:1.25em;line-height:1}
.pk:not(.up){background:repeating-linear-gradient(45deg,#7d1727 0 6px,#a3212f 6px 12px)}
.pg{display:grid;gap:8px;max-height:60vh;overflow:auto;text-align:left}
.pi{font:inherit;display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:8px 10px;background:#ffffff14;color:#fff;cursor:pointer}
.pi small{display:block;color:#ccc;font-size:12px}
.ek{width:96px;height:140px;padding:5px;gap:4px;border-radius:10px;border:3px solid #fff;font-size:9px;background:linear-gradient(170deg,var(--c),#000c 135%);justify-content:flex-start}
.ek>b{display:flex;align-items:center;justify-content:center;width:100%;min-height:2.5em;background:#000b;border-radius:5px;padding:2px;font-size:11px;line-height:1.1;letter-spacing:.02em}
.ek .art{position:relative;width:100%;flex:1;min-height:0;border-radius:6px;background:radial-gradient(circle at 50% 38%,#fff7,#0003 72%),repeating-linear-gradient(45deg,#ffffff1c 0 6px,#0000 6px 12px);display:grid;place-items:center;border:1px solid #fff7}
.ek .art em{font-size:46px;line-height:1;filter:drop-shadow(0 3px 2px #0009)}
.ek .art small{position:absolute;top:2px;left:3px;font-size:16px}
.ek>span{display:block;width:100%;background:#fffe;color:#222;border-radius:4px;padding:3px 2px;font-size:8.5px;font-weight:600;line-height:1.15;min-height:31px}
.ek.bk>em{font-size:42px}
.ek.bk>span{min-height:0;font-size:12px;font-weight:800}
@media(max-width:480px){.ek{width:80px;height:120px}.ek .art em{font-size:36px}.ek>span{font-size:7.5px;min-height:27px}.ek>b{font-size:9.5px}}
.pop{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:min(92vw,420px);background:#111e;border:2px solid var(--gold);border-radius:12px;padding:10px;text-align:center;color:#fff;box-shadow:0 8px 30px #000a;animation:pu .25s}
@keyframes pu{from{opacity:0;transform:translate(-50%,20px)}}
.pb{height:6px;background:#fff3;border-radius:3px;margin:8px 0;overflow:hidden}
.pb i{display:block;height:100%;background:var(--gold);animation:cdw linear forwards}
@keyframes cdw{from{width:100%}to{width:0}}
.pbt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.pbt .btn{font-size:13px;padding:7px 10px}
.mn .mgb,.cp .mgb{max-width:760px}
.tbl{width:100%;background:radial-gradient(ellipse at 50% 45%,#23864f,#0e3f25 78%);border:10px solid #6b4423;border-radius:22px;box-shadow:inset 0 0 50px #000b,0 8px 24px #000a;padding:8px 6px 10px;display:flex;flex-direction:column;gap:6px}
.seats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seat{background:#0006;border:2px solid #fff3;border-radius:10px;padding:5px 8px;font-size:12px;text-align:left}
.seat.on{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
.seat.x{opacity:.35}
.seat.pk{border-color:#7be08a;cursor:pointer;animation:hb 1s infinite}
.mb{display:inline-block;width:12px;height:18px;border-radius:3px;background:repeating-linear-gradient(45deg,#b34700 0 3px,#ff7a00 3px 6px);border:1px solid #fff8;margin-right:-6px;vertical-align:middle}
.mid{display:flex;gap:26px;justify-content:center;align-items:center;padding:6px 0}
#dk .ek.bk{box-shadow:3px 3px 0 #b34700,6px 6px 0 #7a2f00,0 6px 14px #000a}
#dk.pulse{animation:hb 1s infinite;cursor:pointer;border-radius:12px}
#dz{min-width:108px;min-height:152px;border:2px dashed #fff5;border-radius:12px;display:grid;place-items:center;color:#fffa;font-size:11px;padding:3px}
.fan{display:flex;justify-content:center;padding:26px 8px 4px;min-height:150px;overflow:visible}
.fan .ek{margin:0 var(--ov,-18px);touch-action:none;cursor:grab;transition:transform .15s;transform-origin:50% 120%;user-select:none}
.fan .ek:hover,.fan .ek.sel{transform:translateY(-20px)!important;z-index:5}
.ek.new{animation:dl .5s}@keyframes dl{from{opacity:0;transform:translateY(-220px) scale(.5)}}
.ek.land{animation:ln .35s}@keyframes ln{from{opacity:0;transform:scale(1.5) rotate(12deg)}}
.dragghost{position:fixed;z-index:80;pointer-events:none;margin:0;transform:rotate(-6deg) scale(1.08);box-shadow:0 14px 30px #000b}
.tab{display:grid;grid-template-columns:210px 1fr;gap:10px;background:#0b0d12;border:10px solid #2b2f3a;border-radius:22px;padding:8px;box-shadow:0 0 0 2px #666,0 10px 30px #000a;text-align:left;width:100%}
@media(max-width:560px){.tab{grid-template-columns:1fr}}
.fan2{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}.fan2 .ek{cursor:pointer}
.pl{display:grid;gap:4px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.chc{background:linear-gradient(160deg,var(--c),#000c 150%);border-radius:10px;padding:6px;display:grid;gap:4px;align-content:start;font-size:11px}
.chc b{font-size:12px}.chc .btn{font-size:11px;padding:6px 4px}
.gen{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.gen .btn{flex:1;font-size:12px;padding:8px 4px}
.rb:not(:disabled){animation:hb 1s infinite;background:#7be08a;color:#06240f}
.rb{font-size:11px;padding:6px 4px}
.dpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.dcard{font:inherit;color:#fff;background:#ffffff14;border:2px solid #fff4;border-radius:12px;padding:8px 4px;cursor:pointer;display:grid;gap:2px;justify-items:center}
.dcard:disabled{opacity:.55;cursor:default;border-color:var(--c)}
.dcard svg{width:84px;height:62px}.dcard small{color:#cde}
.race{position:relative;width:100%}
.lane2{position:relative;height:60px;margin:4px 0;border-radius:10px;overflow:hidden;background:linear-gradient(#34a8dc,#15749f);box-shadow:inset 0 0 0 2px #0a4a6e}
.wv{position:absolute;inset:0;background:repeating-radial-gradient(circle at 18px 60px,#ffffff2a 0 2px,#0000 2px 13px);background-size:44px 26px}
.fin{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px}

 else if(t=='s')h=`<div class='asm'><div><small>Giá mua</small><b>${s[2]}tr</b></div>${own}</div><div class='alb'>🚆 Tiền thuê theo số ga cùng chủ</div><div class='ag'>${[1,2,3,4].map(k=>`<div class='ar'><span>${k} ga</span><b>${25*2**(k-1)}tr</b><small></small></div>`).join('')}</div>`;
 else if(t=='t')h=`<div class='ar nt'>💸 Dừng ở ô này phải nộp <b>${s[2]}tr</b> cho ngân hàng.</div>`;
 else if(t=='c')h=`<div class='ar nt'>🃏 Rút một thẻ ${KV.includes(i)?'Khí vận':'Cơ hội'} ngẫu nhiên (bộ ${MAPS[MAPI][KV.includes(i)?'kv':'ch'].length} thẻ, xáo trộn, rút hết mới xáo lại).</div>`+cardList(i);
 else if(t=='g')h=`<div class='ar nt'>🏁 Đi qua nhận <b>200tr</b>, dừng đúng ô này nhận <b>100tr</b>. Ngoại lệ: thẻ "Tiến thẳng đến XUẤT PHÁT" vẫn nhận <b>200tr</b>.</div>`;
 else if(t=='j')h=`<div class='ar nt'>🔒 Ghé thăm tù: chỉ mất phí <b>30tr</b> nộp ngân hàng khi đang có người ngồi tù. Không có ai thì miễn phí như bãi đỗ xe.</div>`;
 else if(t=='f')h=`<div class='ar nt'>🌴 ${s[0]}: dừng ở đây sẽ được đưa tới một ô đất ngẫu nhiên (các ô nhấp nháy 5–7 giây rồi chốt), rồi xử lý ô đó như bình thường.</div>`;
 else if(t=='gj')h=`<div class='ar nt'>👮 ${MAPI==1?'Vào Trường V lùa':'Vào tù'} ngay. Ra tù bằng cách ném đôi, hoặc sau 3 lượt thì nộp 50tr. Ném đôi 3 lần liên tiếp cũng bị vào tù.</div>`;
 else h=`<div class='ar nt'>🎰 Ô Minigame: quay ngẫu nhiên 1 trong ${MG.length} trò.</div><div class='alb'>🔁 3 trò gần nhất</div><div class='ag'>${RECENT.length?RECENT.map(x=>`<div class='ar'><span>${MG[x][0]}</span><b></b><small></small></div>`).join(''):`<div class='ar nt'>Chưa có trò nào.</div>`}</div><div class='alb'>🎮 Danh sách ${MG.length} trò chơi</div><div class='ag' style='max-height:42vh;overflow:auto'>${MG.map(g=>`<div class='ar nt'><b>${g[0]}</b><br><small style='text-align:left;min-width:0'>${DS[g[1].name]||''}</small></div>`).join('')}</div>`;
 $('#mgs').innerHTML=h;$('#mgc').innerHTML=`<button class='btn'>Đóng</button>`;$('#mgc').onclick=()=>{mgClose();if(P)render()}}
async function travel(p){const cand=B.map((s,i)=>i).filter(i=>B[i][1]=='p'||B[i][1]=='s'),cs=[...document.querySelectorAll('#bd .c')];
 say('🌴 '+p.name+' đi nghỉ mát, điểm đến được chọn ngẫu nhiên!');fx('🎲 ĐI ĐÂU ĐÂY?','#f2c14e');cs.forEach(c=>c.classList.add('dm'));
 let el=0,last=-1;
 while(el<6200){const d=70+el/6200*330;if(last>=0)cs[last].classList.remove('bl');let k=cand[Math.random()*cand.length|0];if(k==last)k=cand[(cand.indexOf(k)+1)%cand.length];last=k;cs[k].classList.add('bl');beep(300+Math.random()*500,.04,'square',.04);await sleep(d);el+=d}
 for(let f=0;f<7;f++){cs[last].classList.toggle('bl');beep(f%2?500:700,.08,'triangle',.06);await sleep(170)}
 cs[last].classList.add('bl');coin();say(p.name+' sẽ đến '+B[last][0]+'!');fx('✈️ '+B[last][0],'#7be08a');await sleep(1200);
 cs.forEach(c=>{c.classList.remove('dm');c.classList.remove('bl')});p.pos=last;render();await sleep(500);await land(p)}
async function jailPay(){const p=P[cur];await pay(p,50);p.jail=0;say(p.name+' nộp 50tr để ra tù và đi '+p.jf+' ô.');await move(p,p.jf)}
function jailStay(){phase='end'}
let LYH=[];function lyPick(){const f=[0,1,2,3,4,5].filter(x=>!LYH.includes(x)),u=new Uint32Array(1);crypto.getRandomValues(u);const b=f[u[0]%f.length];LYH.push(b);if(LYH.length>2)LYH.shift();return b}
function myAssets(){if(busy||win)return;const q=P[cur].bot?(P.find(x=>!x.bot&&x.alive)||P[cur]):P[cur];showAssets(q.id)}
function showAssets(id){const q=P[id];if(!q)return;mgOpen('💼 TÀI SẢN: '+q.tok+' '+q.name,'Tiền mặt, đất, nhà và xếp hạng giàu nghèo hiện tại. Bấm vào một người trong bảng xếp hạng để xem tài sản của họ.','as');
 const own=B.map((s,i)=>i).filter(i=>ow[i]==q.id),land=own.reduce((s,i)=>s+B[i][2],0),house=own.reduce((s,i)=>s+lv[i]*B[i][2]/2,0),tot=Math.round(q.cash+land+house);
 const rk=P.filter(x=>x.alive).map(x=>({x,w:wealth(x)})).sort((a,b)=>b.w-a.w),mx=Math.max(...rk.map(r=>r.w),1),grp={};
 own.forEach(i=>{const k=B[i][1]=='p'?B[i][3]:'s';(grp[k]=grp[k]||[]).push(i)});
 $('#mgs').innerHTML=`<div class='asm'><div><small>Tiền mặt</small><b>${q.cash}tr</b></div><div><small>Đất (${own.length} ô)</small><b>${land}tr</b></div><div><small>Nhà đã xây</small><b>${house}tr</b></div><div class='tt'><small>Tổng tài sản</small><b>${tot}tr</b></div></div><div class='alb'>🏆 Xếp hạng tài sản</div><div class='rkb'>${rk.map((r,i)=>`<div class='rkr${r.x==q?' me':''}' onclick='showAssets(${r.x.id})'><i style='width:${Math.round(r.w/mx*100)}%'></i><span>${i+1}. ${r.x.tok} ${r.x.name}${i==0?' 👑':''}</span><b>${r.w}tr</b></div>`).join('')}</div><div class='alb'>🏘️ Đất đang sở hữu</div><div class='asl'>${own.length?Object.keys(grp).map(k=>{const s=k=='s',col=s?'#555':COL[k],full=!s&&hasSet(grp[k][0],q.id);return `<div class='ag'><div class='ah' style='--c:${col}'>${s?'🚆 Ga tàu':'Nhóm màu'}${full?' ✅ đủ bộ (thuê x2)':''}</div>${grp[k].map(i=>`<div class='ar'><span>${B[i][0]}${lv[i]?' '+(lv[i]>4?'🏨':'🏠'.repeat(lv[i])):''}</span><b>${B[i][2]}tr</b><small>thuê ${rent(i,q)}tr</small></div>`).join('')}</div>`}).join(''):`<div class='ar'>Chưa sở hữu ô đất nào.</div>`}</div>`;
 $('#mgc').innerHTML=`<button class='btn'>Đóng</button>`;$('#mgc').onclick=()=>{mgClose();if(P)render()}}
function again(){const q=P[cur];q.again=0;msg="";phase="roll";return roll()}
function mgAbort(){document.querySelectorAll('.pop,.dk4').forEach(e=>e.remove());inp=null;TS=null;const k=MGK;MGK=null;mgClose();if(k)k()}
async function mgQuit(){if(MGK){const r=await popAsk('Thoát minigame này? Sẽ không ai nhận hay mất tiền.',['Thoát','Ở lại'],10,1);if(r==0)mgAbort()}else{mgClose();if(P)render()}}
async function minigame(p){let kill;const kp=new Promise(r=>{kill=r});MGK=kill;
 try{await Promise.race([minigame0(p),kp])}catch(e){console.error(e);say('⚠️ Minigame gặp lỗi nên đã dừng, không ai nhận hay mất tiền.')}
 MGK=null;inp=null;TS=null;document.querySelectorAll('.pop,.dk4').forEach(x=>x.remove());mgClose()}
async function minigame0(p){const gi=pickMG(),g=MG[gi];mgOpen("🎰 Ô MINIGAME",p.tok+" "+p.name+" bước vào sòng. Quay chọn trò chơi…");
 for(let k=0;k<(FORCE>=0?0:15);k++){$("#mgs").innerHTML=`<div class="rl">${MG[k%MG.length][0]}</div>`;beep(300+k*30,.05);await sleep(90+k*25)}
 $("#mgs").innerHTML=`<div class="rl on">${g[0]}</div><div class="pool" style="margin-top:10px">🔁 3 trò gần nhất: ${RECENT.map(x=>MG[x][0]).join(" • ")}</div>`;coin();say("Minigame: "+g[0]+"!");await sleep(1400);await g[1](p);mgClose()}

/* giao diện */
function cell(i){const s=B[i],[r,c]=rc(i),t=s[1],o=ow[i];
 const ic={g:"🏁",s:"🚆",m:"🎰",c:KV.includes(i)?"🎁":"❓",t:"💸",j:"🔒",f:"🌴",gj:"👮"}[t]||"";
 const tk=P.filter(q=>q.alive&&q.pos==i).map(q=>`<b${q.id==hop?' class="hp"':""}>${q.tok}</b>`).join("");
 return `<div class="c${i%10==0?" k":""}${o>=0?" own":""}${P[cur]&&P[cur].pos==i&&!win?" cu":""}" style="grid-area:${r}/${c}${o>=0?";--oc:"+P[o].col:""}" onclick="cellInfo(${i})">${t=="p"?`<div class="bn" style="background:${COL[s[3]]}"></div>`:""}<div class="n">${ic}<span>${s[0]}</span>${s[2]?`<i>${s[2]}tr</i>`:""}</div>${lv[i]?`<div class="sb hs">${lv[i]>4?"🏨":"🏠".repeat(lv[i])}</div>`:""}${tk?`<div class="sw"></div><div class="sb tk">${tk}</div>`:""}</div>`}
function die(v){return `<div class="dw"><div class="dc${fresh?" roll":""}"><div class="di" style="transform:${RV[v]}">${FACE.map(f=>`<i>${f}</i>`).join("")}</div></div></div>`}
function hud(){const p=P[cur];if(phase=='jailpay'&&!p.bot&&!busy)return `<div class='ds'>${die(dice[0])+die(dice[1])}</div><div class='hm'><div class='trn'>${p.tok} ${p.name} (trong tù)</div><div class='msg'>${msg}</div></div><div class='bt'><button class='btn' onclick='act(jailPay)'>💰 Trả 50tr ra tù (đi ${p.jf} ô)</button>${p.tix&&p.tix.length?`<button class='btn' onclick='act(jailTix)'>🎫 Dùng vé ra tù (đi ${p.jf} ô)</button>`:''}<button class='btn ghost' onclick='act(jailStay)'>Ở lại tù</button></div>`;
 if(win)return `<div class="hm"><div class="trn">🏆 ${win.name} thắng!</div><div class="msg">Chiến thắng với tổng tài sản ${wealth(win)}tr.</div></div><div class="bt"><button class="btn" onclick="setup()">Chơi lại</button></div>`;
 let b="";
 if(!p.bot&&!busy){
  if(phase=="roll")b=`<button class="btn" onclick="act(roll)">${p.jail?"Ném xúc xắc thoát tù":"Ném xúc xắc"}</button>${p.jail&&p.tix&&p.tix.length?'<button class="btn ghost" onclick="act(useTix)">🎫 Dùng vé ra tù</button>':''}`;
  else{
   if(phase=="buy")b+=`<button class="btn" onclick="act(buy)" ${p.cash<B[p.pos][2]?"disabled":""}>Mua ${fmt(B[p.pos][2])}</button>`;
   if(phase=="end"&&canUp(p))b+=`<button class="btn" onclick="act(upg)">Xây nhà ${fmt(B[p.pos][2]/2)}</button>`;
   b+=`<button class="btn ghost" onclick="act(${phase=="buy"?"skip":p.again?"again":"endTurn"})">${phase=="buy"?"Bỏ qua":p.again?"🎲 Ném tiếp (được đôi!)":"Kết thúc lượt"}</button>`}}
 return `<div class="ds">${dice?die(dice[0])+die(dice[1]):die(1)+die(1)}</div><div class="hm"><div class="trn">${p.tok} ${p.name}${p.jail?" (trong tù)":""}<small style="opacity:.7;font-weight:400"> — Vòng ${roundNo}${MAXR?"/"+MAXR:""}</small></div><div class="msg">${msg||(p.bot?"Máy đang suy nghĩ…":"Ném xúc xắc nào!")}</div></div><div class="bt">${b}</div>`}
function render(){clearTimeout(tm);const al=P.filter(x=>x.alive);if(al.length<2)win=al[0]||P[0];
 if(win&&!cf){cf=1;confetti()}
 if(!win&&!P[cur].alive)return endTurn();
 $("#bd").innerHTML=B.map((_,i)=>cell(i)).join("")+`<div id="mid"><div class="sb dg">🐉</div><h1>CỜ TỶ PHÚ<small>VIỆT NAM</small></h1></div>`;
 $("#hud").innerHTML=hud();
 $("#pl").innerHTML=P.map(q=>`<div class="pc${q.id==cur&&!win?" on":""}${q.alive?"":" x"}" style="--oc:${q.col}" onclick="if(!busy)showAssets(${q.id})" title="Xem tài sản">${q.tok} <b>${q.name}</b><br>${fmt(q.cash)}<small>${ow.filter(o=>o==q.id).length} ô</small><br><small style="margin:0">💼 ${wealth(q)}tr</small></div>`).join("");
 $("#lg").innerHTML=L.slice(0,6).map(t=>`<div>${t}</div>`).join("");
 if(!win&&!busy&&P[cur].bot)tm=setTimeout(botStep,800)}
function start(n,m){P=[...Array(n)].map((_,i)=>({id:i,name:m=="bot"&&i?"Máy "+i:"Người chơi "+(i+1),tok:TK[i],col:PC[i],cash:1500,pos:0,jail:0,jt:0,alive:1,bot:m=="bot"&&i>0}));
 applyMap();ow=Array(40).fill(-1);lv=Array(40).fill(0);cur=0;roundNo=1;phase="roll";dice=null;msg="";L=["Trò chơi bắt đầu!"];win=null;busy=0;fresh=0;hop=-1;cf=0;
 $("#app").innerHTML=`<div id="stg"><div id="bd"></div><div id="fx"></div><div class="tb"><button class="mi" title="Tài sản của tôi" onclick="myAssets()">💼</button><button class="mi" title="Xoay trái" onclick="rot(-15)">⟲</button><button class="mi" title="Xoay phải" onclick="rot(15)">⟳</button><button class="mi" title="Đổi góc nhìn" onclick="tilt()">📐</button>${TEST?`<button class="mi" title="Thử minigame" onclick="if(!busy&&!win)pickGame(i=>{FORCE=i;act(()=>minigame(P[cur]))})">🧪</button>`:''}<button class="mi" title="Âm thanh" onclick="snd=!snd;this.textContent=snd?'🔊':'🔇'">🔊</button></div></div><div id="hud"></div><div id="pl"></div><div id="lg"></div>`;applyView();render()}
function setup(){clearTimeout(tm);$("#app").innerHTML=`<div class="su"><h1>CỜ TỶ PHÚ<span>VIỆT NAM 3D</span></h1><p>Mua đất khắp ba miền trên bàn cờ nổi, thu tiền thuê và đánh bại đối thủ. Mỗi người bắt đầu với 1500tr. Sở hữu đủ một nhóm màu thì tiền thuê gấp đôi, và bạn có thể xây nhà, khách sạn để tăng thêm.</p><div class="mps">${MAPS.map((m,k)=>`<button class="mapc${k==MAPI?' sel':''}${m.soon?' soon':''}" data-m="${k}" ${m.soon?'disabled':''}><b>${m.name}</b><small>${m.sub}</small>${m.soon?'<i>COMING SOON</i>':''}</button>`).join('')}</div><label>Số người chơi<select id="n"><option>2<option selected>3<option>4</select></label><label>Chế độ<select id="m"><option value="bot">Chơi với máy<option value="loc">Nhiều người chung một máy</select></label><label>Số vòng chơi<select id="rd"><option value="0">Không giới hạn (đến khi còn 1 người)</option><option value="10">10 vòng</option><option value="20">20 vòng</option><option value="30">30 vòng</option><option value="50">50 vòng</option></select></label><button class="btn" id="go">Bắt đầu</button> <button class="btn alt" id="ts">🧪 Chọn minigame để thử</button></div>`;
 document.querySelectorAll('.mapc').forEach(b=>b.onclick=()=>{MAPI=+b.dataset.m;document.querySelectorAll('.mapc').forEach(x=>x.classList.toggle('sel',x==b))});$("#go").onclick=()=>{MAXR=+$("#rd").value;FORCE=-1;TEST=0;start(+$("#n").value,$("#m").value)};$("#ts").onclick=()=>pickGame(i=>{MAXR=+$("#rd").value;FORCE=i;TEST=1;start(+$("#n").value,$("#m").value);act(()=>minigame(P[0]))})}
setup();
</script>
